# Netlify build configuration for Westerly Aerial Co.
# Whatever's in here overrides the dashboard settings, so the site
# always builds the same way no matter who deploys it.

[build]
  command = "npm run build"
  publish = "dist"

# Single-page-app fallback: any unknown URL serves the built index.html
# so the React app can handle routing client-side without a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
