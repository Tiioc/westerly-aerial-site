        "telephone": "+1-208-555-0148",
        "email": "hello@westerlyaerial.com",
        "image": "https://westerlyaerial.com/og.jpg",
        "logo": "https://westerlyaerial.com/favicon.svg",
        "priceRange": "$$",
        "currenciesAccepted": "USD",
        "sameAs": ["https://instagram.com/westerlyaerial"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Garden City",
          "addressRegion": "ID",

          { "@type": "City", "name": "Garden City, Idaho" },

          { "@type": "City", "name": "McCall, Idaho" },

          "Aerial photography Boise",
          "Drone photography Garden City",
          "Golf course aerial video Idaho",
          "Treasure Valley aerial marketing",
          "Resort and hospitality marketing",
          "Real estate aerial photography"

        "hasCredential": "FAA Part 107 Remote Pilot Certificate"
